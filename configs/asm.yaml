server:
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  max_code_size: 1048576
sandbox:
  mode: direct
  time_limit: 5
  max_memory: 268435456
  max_file_size: 10485760
  max_processes: 32
  runtime_user: 1000
  runtime_group: 1000
languages:
  asm:
    name: Assembly
    extension: .asm
    compile_cmd: [sh, -c, "if [ \"$(uname -m)\" = \"x86_64\" ]; then nasm -f elf64 {file} -o {dir}/code.o; else as -o {dir}/code.o {file}; fi && ld {dir}/code.o -o {output}"]
    run_cmd: ["{output}"]
    source_file: main.asm
